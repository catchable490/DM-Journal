<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM Journal - Owlbear Rodeo Extension</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background: #0f111a; color: #f1f5f9; margin: 0; padding: 0; height: 100vh; overflow-x: hidden; }
      #app { height: 100%; display: flex; flex-direction: column; }
      .journal-container { display: flex; flex-direction: column; height: 100%; padding: 14px; gap: 12px; }
      .journal-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid rgba(139,92,246,0.2); }
      .brand-title { font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 700; color: #fff; }
      .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
      .status-badge.inactive { background: rgba(100,116,139,0.15); color: #94a3b8; border-color: rgba(100,116,139,0.3); }
      .hotkey-banner { display: flex; align-items: center; justify-content: space-between; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); border-radius: 8px; padding: 10px 14px; }
      .kbd-badge { background: #0f111a; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 2px 7px; font-family: 'JetBrains Mono', monospace; color: #8b5cf6; font-weight: 700; }
      .btn-quick-summon { background: #8b5cf6; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
      .scene-bar { display: flex; align-items: center; justify-content: space-between; background: #181b28; border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.05); }
      .scene-name { color: #06b6d4; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
      .action-row { display: flex; gap: 8px; }
      .btn-action { background: #202436; border: 1px solid rgba(139,92,246,0.2); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
      .btn-copy { background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(6,182,212,0.25)); border-color: #8b5cf6; font-weight: 600; }
      .nav-tabs { display: flex; gap: 4px; background: #181b28; padding: 4px; border-radius: 8px; }
      .nav-tab { flex: 1; background: transparent; border: none; color: #94a3b8; padding: 6px; font-weight: 600; border-radius: 6px; cursor: pointer; }
      .nav-tab.active { background: #202436; color: #fff; border: 1px solid rgba(139,92,246,0.3); }
      .tab-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .content-pane { display: none; height: 100%; flex-direction: column; }
      .content-pane.active { display: flex; }
      .markdown-view { flex: 1; overflow-y: auto; background: #181b28; border-radius: 8px; padding: 14px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.05); }
      .raw-editor { width: 100%; height: 100%; background: #181b28; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; padding: 12px; resize: none; outline: none; }
      .obsidian-link { color: #8b5cf6; background: rgba(139,92,246,0.15); padding: 1px 5px; border-radius: 4px; font-weight: 600; }
      .quick-popup-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,17,26,0.8); backdrop-filter: blur(8px); display: flex; justify-content: center; padding-top: 40px; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
      .quick-popup-overlay.active { opacity: 1; pointer-events: auto; }
      .quick-popup-card { width: 90%; max-width: 500px; background: #181b28; border: 1px solid #8b5cf6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .popup-input { width: 100%; background: #202436; border: 1px solid rgba(139,92,246,0.3); border-radius: 8px; color: #fff; font-size: 0.95rem; padding: 10px 14px; outline: none; }
      .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10001; }
      .toast { background: #202436; border: 1px solid #8b5cf6; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; }
      .gm-guard { height: 100%; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
